name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o pass-flashcards-mvp.zip -d extracted
          cp -r extracted/pass-flashcards-mvp/. .
          rm -rf extracted
          rm -f pass-flashcards-mvp.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add PASS Cards project" || exit 0
          git push
